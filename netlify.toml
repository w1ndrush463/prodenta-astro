[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Fingerprinted assets never change, so cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Links that existed on the old site but had no page behind them.
[[redirects]]
  from = "/dental/cosmetic-dentistry"
  to = "/treatments#enhance"
  status = 301

[[redirects]]
  from = "/dental/nervous-patients"
  to = "/reviews"
  status = 301
